kind = "mobile"
previewPath = "/"
title = "Little Sprout"
description = "Child-friendly Grade 1 learning app with narrated Addition scenes, homework adventures, practice and exams, and parent insights connected to saved device-profile progress."
version = "1.0.0"
id = "artifacts/little-sprout"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18284

[services.development]
run = "pnpm --filter @workspace/little-sprout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-sprout", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/little-sprout", "run", "serve" ]

[services.env]
PORT = "18284"
BASE_PATH = "/"
