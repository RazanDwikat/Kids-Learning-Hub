openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /textbooks:
    get:
      operationId: listTextbooks
      tags: [homework]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Available real textbook editions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Textbook" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /textbooks/{bookId}/pages:
    get:
      operationId: listTextbookPages
      tags: [homework]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/bookId" }]
      responses:
        "200":
          description: Printed pages including pages without exercises
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TextbookPage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /textbooks/{bookId}/pages/{pageNumber}/runs:
    post:
      operationId: startTextbookHomework
      tags: [homework]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/bookId" }, { $ref: "#/components/parameters/pageNumber" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityStart" }
      responses:
        "200":
          description: Exact page exercise run; resumes active run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /homework/photo/status:
    get:
      operationId: getHomeworkPhotoStatus
      tags: [homework]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Honest recognition capability; no extracted questions until a provider is connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeworkPhotoStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /homework/photo/recognize:
    post:
      operationId: recognizeHomeworkPhoto
      tags: [homework]
      security: [{ bearerAuth: [] }]
      responses:
        "503":
          description: Recognition unavailable until provider and parent review pipeline connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /reward-config:
    get:
      operationId: getRewardConfig
      tags: [activities]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Same-device parent-configured reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: saveRewardConfig
      tags: [activities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardConfigInput" }
      responses:
        "200":
          description: Saved configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /reward-options:
    get:
      operationId: listRewardOptions
      tags: [activities]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Parent reward pool for this child
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RewardOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createRewardOption
      tags: [activities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardOptionInput" }
      responses:
        "201":
          description: Created reward option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /reward-options/{rewardId}:
    parameters:
      - in: path
        name: rewardId
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRewardOption
      tags: [activities]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardOptionInput" }
      responses:
        "200":
          description: Updated reward option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRewardOption
      tags: [activities]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /activities:
    get:
      operationId: getActivityCatalog
      tags: [activities]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Available Grade 1 activities with child progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivitySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /activities/{activityId}/runs:
    post:
      operationId: startActivityRun
      tags: [activities]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/activityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityStart" }
      responses:
        "200":
          description: Existing in-progress run or newly started run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /activities/runs/{runId}:
    get:
      operationId: getActivityRun
      tags: [activities]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/runId" }]
      responses:
        "200":
          description: Owned run and safe public questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /activities/runs/{runId}/attempts:
    post:
      operationId: submitActivityAttempt
      tags: [activities]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/runId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityAttemptInput" }
      responses:
        "200":
          description: Evaluated answer and updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAttemptResult" }
        "400":
          description: Pre-write validation rejection; safe to edit this answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAnswerRejection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Reconcile confirmed run progress; preserve the pending payload and request ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityAnswerConflict" }
  /dashboard:
    get:
      operationId: getChildDashboard
      tags: [activities]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Child's own profile and stored progress, also used on this device's parent view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChildDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /learning/session:
    post:
      operationId: createLearningSession
      tags: [learning]
      responses:
        "201":
          description: New anonymous child and one-time credential
          content:
            application/json:
              schema:
                type: object
                required: [token, state]
                properties:
                  token: { type: string }
                  state: { $ref: "#/components/schemas/LearningState" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /learning/state:
    get:
      operationId: getLearningState
      tags: [learning]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authenticated child learning state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /learning/scenes/{sceneId}/progress:
    patch:
      operationId: updateLearningSceneProgress
      tags: [learning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/sceneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [positionPercent]
              properties:
                positionPercent: { type: integer, minimum: 0, maximum: 100 }
                movedCount: { type: integer, minimum: 0, maximum: 2 }
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningStateEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /learning/scenes/{sceneId}/attempts:
    post:
      operationId: submitLearningSceneAttempt
      tags: [learning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/sceneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, answer]
              properties:
                requestId: { type: string, format: uuid }
                answer: { type: integer }
      responses:
        "200":
          description: Evaluated answer
          content:
            application/json:
              schema:
                type: object
                required: [correct, feedback, state]
                properties:
                  correct: { type: boolean }
                  feedback: { type: string }
                  state: { $ref: "#/components/schemas/LearningState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /learning/scenes/{sceneId}/advance:
    post:
      operationId: advanceLearningScene
      tags: [learning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/sceneId" }]
      responses:
        "200":
          description: Advanced lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningStateEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /learning/scenes/{sceneId}/explanation:
    post:
      operationId: recordLearningSceneExplanation
      tags: [learning]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/sceneId" }]
      responses:
        "200":
          description: Help recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningStateEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Unknown scene
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Lesson progression conflict or reused request ID
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    TooManyRequests:
      description: Rate limit reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    bookId:
      in: path
      name: bookId
      required: true
      schema: { type: string }
    pageNumber:
      in: path
      name: pageNumber
      required: true
      schema: { type: integer }
    activityId:
      in: path
      name: activityId
      required: true
      schema: { type: string }
    runId:
      in: path
      name: runId
      required: true
      schema: { type: string, format: uuid }
    sceneId:
      in: path
      name: sceneId
      required: true
      schema: { type: string }
  schemas:
    Textbook:
      type: object
      required: [id, grade, subject, title]
      properties:
        id: { type: string }
        grade: { type: string }
        subject: { type: string }
        title: { type: string }
    TextbookPage:
      type: object
      required: [number, lesson, title, exerciseCount, activityId]
      properties:
        number: { type: integer }
        lesson: { type: string }
        title: { type: string }
        exerciseCount: { type: integer }
        activityId: { type: ["string", "null"] }
    HomeworkPhotoStatus:
      type: object
      required: [available, message, requiresParentReview]
      properties:
        available: { type: boolean }
        message: { type: string }
        requiresParentReview: { type: boolean }
    RewardConfigInput:
      type: object
      additionalProperties: false
      required: [enabled, category, title, message]
      properties:
        enabled: { type: boolean }
        category: { type: string, enum: [activity, snack, screen_time, other] }
        title: { type: string, minLength: 1, maxLength: 100 }
        message: { type: string, maxLength: 300 }
    RewardConfig:
      allOf:
        - { $ref: "#/components/schemas/RewardConfigInput" }
    RewardOptionInput:
      type: object
      additionalProperties: false
      required: [enabled, title, message]
      properties:
        enabled: { type: boolean }
        category: { type: string, enum: [activity, snack, screen_time, other] }
        title: { type: string, minLength: 1, maxLength: 100 }
        message: { type: string, minLength: 1, maxLength: 300 }
    RewardOption:
      type: object
      required: [id, enabled, category, title, message]
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }
        category: { type: string, enum: [activity, snack, screen_time, other] }
        title: { type: string }
        message: { type: string }
    ActivitySource:
      type: object
      required: [bookId, pageNumber, lesson]
      properties:
        bookId: { type: string }
        pageNumber: { type: integer }
        lesson: { type: string }
    ActivitySummary:
      type: object
      required: [id, title, kind, lessonId, questionCount, completedRuns, activeRunId, bestScore]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [homework, practice, exam] }
        lessonId: { type: string }
        questionCount: { type: integer }
        completedRuns: { type: integer }
        activeRunId: { type: [string, "null"] }
        bestScore: { type: [integer, "null"] }
    ActivityStart:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        restart: { type: boolean, description: "Required true to start a new run after completing the previous run." }
    ActivityAnswer:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
        items:
          type: array
          items: { type: string }
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPair"
    ActivityPair:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left: { type: string }
        right: { type: string }
    ActivityQuestion:
      type: object
      required: [id, type, prompt, options, tokens, left, right, concept]
      properties:
        id: { type: string }
        type: { type: string, enum: [choice, drag, matching, counting, direct, ordering] }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        tokens:
          type: array
          items: { type: string }
        left:
          type: array
          items: { type: string }
        right:
          type: array
          items: { type: string }
        concept: { type: string }
        number: { type: integer, description: "Printed textbook question number, when applicable" }
        illustration: { type: string, description: "Book illustration label, when applicable" }
    ActivityFeedback:
      type: object
      required: [questionId, correct, feedback, answer]
      properties:
        questionId: { type: string }
        correct: { type: boolean }
        feedback: { type: string }
        answer: { $ref: "#/components/schemas/ActivityAnswer" }
    ActivityRun:
      type: object
      required: [id, activityId, kind, title, currentIndex, total, correctCount, completedAt, questions, lastFeedback, source, reward, attemptCount]
      properties:
        id: { type: string }
        activityId: { type: string }
        kind: { type: string, enum: [homework, practice, exam] }
        title: { type: string }
        currentIndex: { type: integer }
        total: { type: integer }
        correctCount: { type: integer }
        completedAt: { type: [string, "null"], format: date-time }
        source:
          oneOf:
            - { $ref: "#/components/schemas/ActivitySource" }
            - { type: "null" }
        reward:
          oneOf:
            - { $ref: "#/components/schemas/RewardConfig" }
            - { type: "null" }
        attemptCount: { type: integer }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ActivityQuestion" }
        lastFeedback:
          oneOf:
            - { $ref: "#/components/schemas/ActivityFeedback" }
            - { type: "null" }
    ActivityAttemptInput:
      type: object
      additionalProperties: false
      required: [requestId, questionId, answer]
      properties:
        requestId: { type: string, format: uuid }
        questionId: { type: string }
        answer: { $ref: "#/components/schemas/ActivityAnswer" }
    ActivityAttemptResult:
      type: object
      required: [correct, feedback, run]
      properties:
        correct: { type: boolean }
        feedback: { type: string }
        run: { $ref: "#/components/schemas/ActivityRun" }
    ChildDashboard:
      type: object
      required: [child, grade, subject, lesson, todayActivity, lessonsCompleted, activities, totalCorrect, totalAttempts, strengths, needsPractice, streakDays, rewards]
      properties:
        child:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        grade: { type: string }
        subject: { type: string }
        lesson:
          type: object
          required: [id, title, currentSceneIndex, totalScenes, completed]
          properties:
            id: { type: string }
            title: { type: string }
            currentSceneIndex: { type: integer }
            totalScenes: { type: integer }
            completed: { type: boolean }
        todayActivity: { type: integer, description: "Number of stored attempts and scene completions today (UTC)." }
        lessonsCompleted: { type: integer }
        activities:
          type: array
          items: { $ref: "#/components/schemas/ActivitySummary" }
        totalCorrect: { type: integer }
        totalAttempts: { type: integer }
        strengths:
          type: array
          items: { type: string }
        needsPractice:
          type: array
          items: { type: string }
        streakDays: { type: integer }
        rewards: { type: integer, description: "One reward per completed run." }
    ActivityAnswerRejection:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: "Human-readable text; not a recovery discriminator." }
        code:
          type: string
          enum: [ACTIVITY_ANSWER_REJECTED]
          description: Guaranteed pre-write rejection. Only HTTP 400 with this code permits editing pending answers.
    ActivityAnswerConflict:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [ACTIVITY_REQUEST_ID_CONFLICT, ACTIVITY_RUN_COMPLETE, ACTIVITY_QUESTION_NOT_CURRENT]
          description: Never proof that an earlier submission was not saved.
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    LearningScene:
      type: object
      required: [id, index, title, caption, color, type, durationMs, operands, options, questionId]
      properties:
        id: { type: string }
        index: { type: integer }
        title: { type: string }
        caption: { type: string }
        color: { type: string }
        type: { type: string, enum: [video, drag, choice] }
        durationMs: { type: [integer, "null"] }
        operands:
          type: object
          required: [a, b]
          properties:
            a: { type: integer }
            b: { type: integer }
        options:
          type: array
          items: { type: integer }
        questionId: { type: [string, "null"] }
    LearningState:
      type: object
      required: [child, grade, subject, lesson, progress, summary]
      properties:
        child:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        grade:
          type: object
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
        subject:
          type: object
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
        lesson:
          type: object
          required: [id, title, scenes]
          properties:
            id: { type: string }
            title: { type: string }
            scenes:
              type: array
              items: { $ref: "#/components/schemas/LearningScene" }
        progress:
          type: object
          required: [currentSceneIndex, completedSceneIds, scenes, lessonCompleted, completedAt]
          properties:
            currentSceneIndex: { type: integer }
            completedSceneIds:
              type: array
              items: { type: string }
            scenes:
              type: array
              items:
                type: object
                required: [sceneId, positionPercent, movedCount, solved]
                properties:
                  sceneId: { type: string }
                  positionPercent: { type: integer }
                  movedCount: { type: integer }
                  solved: { type: boolean }
            lessonCompleted: { type: boolean }
            completedAt: { type: [string, "null"], format: date-time }
        summary:
          type: object
          required: [attempts, independent, hints, explanations]
          properties:
            attempts: { type: integer }
            independent: { type: integer }
            hints: { type: integer }
            explanations: { type: integer }
    LearningStateEnvelope:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/LearningState" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

